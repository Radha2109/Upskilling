<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Directory Structure Demo</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="icons/bootstrap-icons.css">
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-primary">Bootstrap Directory Structure Demo</h1>

        <!-- CSS Example -->
        <div class="card p-3 mb-3">
            <h3>CSS Folder Example</h3>
            <p>This card uses Bootstrap CSS classes.</p>
            <button class="btn btn-success">CSS Button</button>
        </div>

        <!-- Icons Example -->
        <div class="mb-3">
            <h3>Icons Folder Example</h3>
            <i class="bi bi-house-fill fs-2"></i>
            <i class="bi bi-person-fill fs-2"></i>
            <i class="bi bi-search fs-2"></i>
        </div>

        <!-- JS Example -->
        <div>
            <h3>JS Folder Example</h3>
            <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#demo">
                Show / Hide Content
            </button>

            <div id="demo" class="collapse mt-3">
                <div class="alert alert-info">
                    This content is displayed using Bootstrap JavaScript.
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
