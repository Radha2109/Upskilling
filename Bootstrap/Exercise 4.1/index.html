<!DOCTYPE html>
<html>
<head>
    <title>Two Column Layout</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 bg-light p-3">
            <h3>Sidebar</h3>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </div>

        <!-- Content Area -->
        <div class="col-md-9 p-3">
            <h2>Main Content</h2>
            <p>
                This is the main content area. It occupies 9 columns,
                while the sidebar occupies 3 columns.
            </p>
        </div>

    </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
