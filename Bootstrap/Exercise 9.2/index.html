<!DOCTYPE html>
<html>
<head>
    <title>Button Groups and Toggle Buttons</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

    <h2>Button Group</h2>
    <div class="btn-group" role="group">
        <button type="button" class="btn btn-primary">Left</button>
        <button type="button" class="btn btn-primary">Middle</button>
        <button type="button" class="btn btn-primary">Right</button>
    </div>

    <hr>

    <h2>Toggle Buttons</h2>
    <input type="checkbox" class="btn-check" id="btn1" autocomplete="off">
    <label class="btn btn-outline-success" for="btn1">Option 1</label>

    <input type="checkbox" class="btn-check" id="btn2" autocomplete="off">
    <label class="btn btn-outline-danger" for="btn2">Option 2</label>

</div>

<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
