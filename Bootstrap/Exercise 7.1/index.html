<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Typography</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    
    <h1 class="display-1">Display 1 Heading</h1>
    
    <p class="lead">
        This is a lead paragraph used to highlight important content.
    </p>

    <p class="text-muted">
        This text is muted and appears lighter.
    </p>

    <p class="fw-bold">
        This text is bold using fw-bold.
    </p>

    <p class="fst-italic">
        This text is italic.
    </p>

    <p class="text-uppercase">
        This text is uppercase.
    </p>

</div>

<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
